<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Grocery"><title>Grocery</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0ea;color:#302f2c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:28px 20px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start}.ey{font-size:12px;letter-spacing:2px;color:#8a8379;font-weight:700}.title{font-size:38px;font-weight:700;margin:3px 0 2px}.count{font-size:13px;color:#777168}.tabs{display:flex;gap:8px;margin:24px 0 18px}.tab{flex:1;border:1px solid #d0c8bd;background:#ebe6de;padding:12px;border-radius:10px;font-weight:700}.tab.on{background:#6d8796;color:#fff;border-color:#6d8796}.search{width:100%;border:1px solid #d3cbc0;background:#fffaf4;border-radius:12px;padding:14px 15px;font-size:16px;margin-bottom:18px}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.bar h2{font-size:13px;letter-spacing:1.7px;color:#777168;margin:0}.add{border:0;background:#6d8796;color:white;border-radius:9px;padding:10px 13px;font-weight:700}.cat{margin:22px 0}.catname{font-size:12px;letter-spacing:1.6px;color:#8a8379;font-weight:700;margin-bottom:7px}.item{display:flex;align-items:center;padding:13px 2px;border-bottom:1px solid #ded7cd;font-size:18px;user-select:none;-webkit-user-select:none}.check{width:26px;height:26px;border:2px solid #aaa196;border-radius:50%;margin-right:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.item.on .check{background:#5f8b63;border-color:#5f8b63;color:#fff}.item.on .check:after{content:'✓';font-size:16px}.name{flex:1}.trash{width:36px;height:36px;border:0;background:transparent;color:#b94f49;display:flex;align-items:center;justify-content:center;border-radius:9px;margin-left:8px;flex:0 0 auto}.trash:active{background:#f1dedb}.trash svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.empty{padding:30px 0;color:#8a8379;text-align:center}.modal{display:none;position:fixed;inset:0;background:rgba(30,29,27,.42);align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;background:#f7f3ed;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px rgba(0,0,0,.12)}.sheet h3{margin:0 0 18px;font-size:22px}.label{font-size:12px;font-weight:700;letter-spacing:1px;color:#777168;margin:14px 0 6px}.field,select{width:100%;padding:13px;border:1px solid #cec6ba;border-radius:10px;background:white;font-size:16px}.row{display:flex;align-items:center;margin:17px 0;gap:10px}.row input{width:20px;height:20px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:10px;border:1px solid #cfc7bc;background:#ebe6de;font-weight:700}.actions .primary{background:#6d8796;color:#fff;border-color:#6d8796}.danger{color:#9b4c47!important}.msg{font-size:13px;color:#9b4c47;margin-top:10px;min-height:18px}
</style></head><body><div class="wrap"><div class="top"><div><div class="ey">FAMILY HUB</div><div class="title">Grocery</div><div class="count" id="count">Loading…</div></div></div><div class="tabs"><button class="tab on" data-tab="shopping">SHOPPING LIST</button><button class="tab" data-tab="all">ALL ITEMS</button></div><input id="search" class="search" placeholder="Search groceries…"><div class="bar"><h2 id="sectionTitle">SHOPPING LIST</h2><button class="add" id="addBtn">+ ADD ITEM</button></div><div id="list"></div></div>
<div class="modal" id="modal"><div class="sheet"><h3 id="modalTitle">Add Grocery Item</h3><div class="label">ITEM NAME</div><input class="field" id="itemName" placeholder="e.g. Coconut Water"><div class="label">CATEGORY</div><select id="category"><option>DAIRY & EGGS</option><option>FRUIT & VEGETABLES</option><option selected>PANTRY</option><option>HOUSEHOLD</option><option>MEAT & SEAFOOD</option><option>DRINKS</option><option>FROZEN</option><option>PERSONAL CARE</option><option>BABY & KIDS</option></select><div class="row" id="needRow"><input type="checkbox" id="needed" checked><label for="needed">Add to Shopping List</label></div><div class="msg" id="msg"></div><div class="actions"><button id="deleteBtn" class="danger" style="display:none">DELETE</button><button id="cancelBtn">CANCEL</button><button class="primary" id="saveBtn">ADD ITEM</button></div></div></div><div class="modal" id="removeModal"><div class="sheet"><h3>Remove item?</h3><div class="count" id="removeName" style="font-size:16px;margin-bottom:20px"></div><div class="actions"><button id="removeNo">NO</button><button id="removeYes" class="danger">YES</button></div></div></div>
<script>
var items=[],tab='shopping',editing=null,pressTimer=null,suppressClick=false,pending={},desired={},inFlight={},removeId=null;
function req(method,data,cb){var x=new XMLHttpRequest();x.open(method,'/api/grocery',true);if(data)x.setRequestHeader('Content-Type','application/json');x.onreadystatechange=function(){if(x.readyState===4){var r={};try{r=JSON.parse(x.responseText)}catch(e){}cb&&cb(x.status,r)}};x.send(data?JSON.stringify(data):null)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function find(id){for(var i=0;i<items.length;i++)if(Number(items[i].id)===Number(id))return items[i]}
function replace(it){for(var i=0;i<items.length;i++)if(Number(items[i].id)===Number(it.id)){items[i]=it;return}items.push(it)}
function mergeServer(server){var local={};for(var i=0;i<items.length;i++)local[Number(items[i].id)]=items[i];for(var j=0;j<server.length;j++){var id=Number(server[j].id),raw=Number(server[j].needed);if(pending[id]&&local[id]){if(raw===Number(desired[id])){delete pending[id];delete desired[id]}else{server[j].needed=Number(desired[id])}}}items=server}
function load(){req('GET',null,function(s,r){if(s===200){mergeServer(r.items||[]);render()}})}
function render(){var q=document.getElementById('search').value.toLowerCase(),show=items.filter(function(i){return(tab==='all'||Number(i.needed)===1)&&(!q||i.name.toLowerCase().indexOf(q)>=0)}),groups={},order=[],h='';show.forEach(function(i){if(!groups[i.category]){groups[i.category]=[];order.push(i.category)}groups[i.category].push(i)});order.forEach(function(c){h+='<div class="cat"><div class="catname">'+esc(c)+'</div>';groups[c].forEach(function(i){h+='<div class="item '+(Number(i.needed)===1?'on':'')+'" data-id="'+i.id+'"><div class="check"></div><div class="name">'+esc(i.name)+'</div>'+(tab==='all'?'<button class="trash" data-remove="'+i.id+'" aria-label="Remove '+esc(i.name)+'"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 10v6M14 10v6"/></svg></button>':'')+'</div>'});h+='</div>'});if(!show.length)h='<div class="empty">'+(tab==='shopping'?'Your shopping list is empty.':'No items found.')+'</div>';document.getElementById('list').innerHTML=h;var n=items.filter(function(i){return Number(i.needed)===1}).length;document.getElementById('count').innerHTML=n+' item'+(n===1?'':'s')+' to buy';document.getElementById('sectionTitle').innerHTML=tab==='shopping'?'SHOPPING LIST':'ALL ITEMS';bindItems()}
function bindItems(){var els=document.getElementsByClassName('item');for(var i=0;i<els.length;i++){(function(el){var id=Number(el.getAttribute('data-id'));el.onclick=function(e){if(e.target.closest&&e.target.closest('.trash'))return;if(suppressClick){suppressClick=false;return}toggle(id)};el.ontouchstart=function(e){if(e.target.closest&&e.target.closest('.trash'))return;suppressClick=false;pressTimer=setTimeout(function(){suppressClick=true;openEdit(id)},650)};el.ontouchend=el.ontouchmove=function(){clearTimeout(pressTimer)};el.oncontextmenu=function(e){e.preventDefault();openEdit(id)}})(els[i])}var tr=document.getElementsByClassName('trash');for(var j=0;j<tr.length;j++)tr[j].onclick=function(e){e.stopPropagation();askRemove(Number(this.getAttribute('data-remove')))}}
function toggle(id){var it=find(id);if(!it)return;var next=Number(it.needed)===1?0:1;it.needed=next;desired[id]=next;pending[id]=true;render();syncItem(id)}
function syncItem(id){if(inFlight[id])return;var target=Number(desired[id]);inFlight[id]=true;req('POST',{action:'set',id:id,needed:target===1},function(s,r){inFlight[id]=false;if(s>=200&&s<300){if(desired[id]!==target){syncItem(id);return}if(r.item&&Number(r.item.needed)===target){var it=find(id);if(it)it.needed=target}setTimeout(load,250)}else{delete pending[id];delete desired[id];load()}})}
function openAdd(){editing=null;document.getElementById('modalTitle').innerHTML='Add Grocery Item';document.getElementById('itemName').value='';document.getElementById('category').value='PANTRY';document.getElementById('needed').checked=true;document.getElementById('needRow').style.display='flex';document.getElementById('deleteBtn').style.display='none';document.getElementById('saveBtn').innerHTML='ADD ITEM';document.getElementById('msg').innerHTML='';document.getElementById('modal').className='modal show';setTimeout(function(){document.getElementById('itemName').focus()},200)}
function openEdit(id){var it=find(id);if(!it)return;editing=id;document.getElementById('modalTitle').innerHTML='Edit Grocery Item';document.getElementById('itemName').value=it.name;var sel=document.getElementById('category'),found=false;for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===it.category)found=true;if(!found){var o=document.createElement('option');o.text=it.category;o.value=it.category;sel.add(o)}sel.value=it.category;document.getElementById('needRow').style.display='none';document.getElementById('deleteBtn').style.display='block';document.getElementById('saveBtn').innerHTML='SAVE';document.getElementById('msg').innerHTML='';document.getElementById('modal').className='modal show'}
function closeModal(){document.getElementById('modal').className='modal'}
function save(){var name=document.getElementById('itemName').value.trim(),category=document.getElementById('category').value,msg=document.getElementById('msg');if(!name){msg.innerHTML='Enter an item name.';return}var data=editing?{action:'update',id:editing,name:name,category:category}:{action:'create',name:name,category:category,needed:document.getElementById('needed').checked};req('POST',data,function(s,r){if(s>=200&&s<300){replace(r.item);closeModal();tab='all';setTabs();render()}else msg.innerHTML=esc(r.error||'Could not save item.')})}
function askRemove(id){var it=find(id);if(!it)return;removeId=id;document.getElementById('removeName').innerHTML=esc(it.name);document.getElementById('removeModal').className='modal show'}
function closeRemove(){removeId=null;document.getElementById('removeModal').className='modal'}
function confirmRemove(){if(!removeId)return;var id=removeId;req('POST',{action:'delete',id:id},function(s){if(s>=200&&s<300){items=items.filter(function(i){return Number(i.id)!==Number(id)});delete pending[id];delete desired[id];delete inFlight[id];closeRemove();render()}})}
function del(){if(!editing)return;closeModal();askRemove(editing)}
function setTabs(){var t=document.getElementsByClassName('tab');for(var i=0;i<t.length;i++)t[i].className='tab'+(t[i].getAttribute('data-tab')===tab?' on':'')}
document.getElementById('addBtn').onclick=openAdd;document.getElementById('cancelBtn').onclick=closeModal;document.getElementById('saveBtn').onclick=save;document.getElementById('deleteBtn').onclick=del;document.getElementById('removeNo').onclick=closeRemove;document.getElementById('removeYes').onclick=confirmRemove;document.getElementById('search').oninput=render;var tabs=document.getElementsByClassName('tab');for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){tab=this.getAttribute('data-tab');setTabs();render()};document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal()};document.getElementById('removeModal').onclick=function(e){if(e.target===this)closeRemove()};load();setInterval(load,5000);
</script></body></html>
