<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grocery">
<meta name="theme-color" content="#f3f0ea">
<link rel="apple-touch-icon" href="/grocery/apple-touch-icon.png">
<link rel="manifest" href="/grocery/manifest.webmanifest">
<title>Grocery · Family Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f3f0ea;color:#302f2c}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{max-width:680px;margin:0 auto;padding:22px 18px 40px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{display:flex;align-items:center;gap:12px}.basket{width:42px;height:42px;border-radius:13px;background:#e7e1d8;display:flex;align-items:center;justify-content:center}.basket svg{width:24px;height:24px;fill:none;stroke:#4f4b46;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}h1{font-size:28px;margin:0}.count{font-size:13px;color:#777168}.tabs{display:flex;background:#e7e1d8;border-radius:12px;padding:4px;margin-bottom:16px}.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:11px 8px;font-weight:700;font-size:12px;letter-spacing:.6px;color:#777168}.tab.active{background:#fff;color:#302f2c;box-shadow:0 1px 3px rgba(0,0,0,.08)}.search{width:100%;border:1px solid #d2cabf;background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;margin-bottom:18px}.section{margin-bottom:20px}.section-title{font-size:12px;letter-spacing:1.4px;font-weight:700;color:#8a8379;margin:0 0 8px 3px}.item{display:flex;align-items:center;background:#ebe6de;border-radius:11px;padding:13px 12px;margin-bottom:7px;min-height:50px}.item:active{transform:scale(.99)}.check{width:26px;height:26px;border:2px solid #aaa196;border-radius:50%;margin-right:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.item.on .check{background:#5f8b63;border-color:#5f8b63;color:#fff}.item.on .check:after{content:'✓';font-size:15px}.name{font-size:17px;font-weight:500}.item.on .name{font-weight:650}.shopping .item{background:#fff;border:1px solid #ddd6cc}.empty{text-align:center;color:#8a8379;padding:54px 20px;font-size:16px}.hint{text-align:center;color:#aaa39a;font-size:11px;margin-top:26px}.offline{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#302f2c;color:white;padding:7px 12px;border-radius:16px;font-size:12px;display:none}
</style>
</head>
<body><main class="app"><header class="head"><div class="title"><div class="basket"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.4 11H5.4L4 8Z"/><path d="m8 8 4-4 4 4M8.5 11.5v4M12 11.5v4M15.5 11.5v4"/></svg></div><div><h1>Grocery</h1><div class="count" id="count">Loading…</div></div></div></header><div class="tabs"><button class="tab active" data-tab="shopping">SHOPPING LIST</button><button class="tab" data-tab="all">ALL ITEMS</button></div><input id="search" class="search" type="search" placeholder="Search groceries…" autocomplete="off"><div id="content"></div><div class="hint">Shared with your Family Hub · updates automatically</div></main><div id="offline" class="offline">Offline · retrying</div>
<script>
(function(){var items=[],tab='shopping',query='',pending={},desired={},inFlight={},awaiting={};function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s||''));return d.innerHTML}function findItem(id){for(var i=0;i<items.length;i++)if(Number(items[i].id)===Number(id))return items[i];return null}function mergeServer(server){var local={};for(var i=0;i<items.length;i++)local[Number(items[i].id)]=items[i];for(var j=0;j<server.length;j++){var id=Number(server[j].id);if((pending[id]||awaiting[id])&&local[id]){server[j].needed=local[id].needed;if(awaiting[id]&&Number(server[j].needed)===Number(awaiting[id].target)){delete awaiting[id];delete desired[id]}}}items=server}function load(){var x=new XMLHttpRequest();x.open('GET','/api/grocery',true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){try{mergeServer(JSON.parse(x.responseText).items||[]);document.getElementById('offline').style.display='none';render()}catch(e){}}else document.getElementById('offline').style.display='block'}};x.send()}function toggle(id){var it=findItem(id);if(!it)return;var next=Number(it.needed)===1?0:1;it.needed=next;desired[id]=next;pending[id]=true;render();syncItem(id)}function syncItem(id){if(inFlight[id])return;var target=desired[id];inFlight[id]=true;var x=new XMLHttpRequest();x.open('POST','/api/grocery',true);x.setRequestHeader('Content-Type','application/json');x.onreadystatechange=function(){if(x.readyState===4){inFlight[id]=false;if(x.status>=200&&x.status<300){var confirmed=target;try{var r=JSON.parse(x.responseText);if(r.item)confirmed=Number(r.item.needed)}catch(e){}if(desired[id]!==target){syncItem(id);return}if(confirmed!==desired[id]){syncItem(id);return}delete pending[id];awaiting[id]={target:desired[id],since:new Date().getTime()};document.getElementById('offline').style.display='none';silentLoad()}else{delete pending[id];delete desired[id];document.getElementById('offline').style.display='block';silentLoad()}}};x.send(JSON.stringify({action:'set',id:id,needed:target===1}))}function silentLoad(){var x=new XMLHttpRequest();x.open('GET','/api/grocery',true);x.onreadystatechange=function(){if(x.readyState===4&&x.status===200){try{mergeServer(JSON.parse(x.responseText).items||[]);document.getElementById('offline').style.display='none';render()}catch(e){}}};x.send()}function render(){var needed=items.filter(function(x){return Number(x.needed)===1});document.getElementById('count').innerHTML=needed.length+(needed.length===1?' item to buy':' items to buy');var list=tab==='shopping'?needed:items;if(query){var q=query.toLowerCase();list=list.filter(function(x){return x.name.toLowerCase().indexOf(q)>=0||x.category.toLowerCase().indexOf(q)>=0})}var h='';if(!list.length){h='<div class="empty">'+(tab==='shopping'?'Your shopping list is clear.':'No matching items.')+'</div>'}else if(tab==='shopping'){h='<div class="shopping">';for(var i=0;i<list.length;i++)h+='<div class="item on" data-id="'+list[i].id+'"><div class="check"></div><div class="name">'+esc(list[i].name)+'</div></div>';h+='</div>'}else{var groups={},order=[];for(var j=0;j<list.length;j++){var c=list[j].category;if(!groups[c]){groups[c]=[];order.push(c)}groups[c].push(list[j])}for(var k=0;k<order.length;k++){var cat=order[k];h+='<section class="section"><div class="section-title">'+esc(cat)+'</div>';for(var m=0;m<groups[cat].length;m++){var it=groups[cat][m];h+='<div class="item '+(Number(it.needed)===1?'on':'')+'" data-id="'+it.id+'"><div class="check"></div><div class="name">'+esc(it.name)+'</div></div>'}h+='</section>'}}document.getElementById('content').innerHTML=h;var nodes=document.getElementsByClassName('item');for(var n=0;n<nodes.length;n++)nodes[n].onclick=function(){toggle(Number(this.getAttribute('data-id')))}}var tabs=document.getElementsByClassName('tab');for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){tab=this.getAttribute('data-tab');for(var j=0;j<tabs.length;j++)tabs[j].className='tab'+(tabs[j]===this?' active':'');render()};document.getElementById('search').oninput=function(){query=this.value||'';render()};load();setInterval(silentLoad,5000)})();
</script></body></html>
