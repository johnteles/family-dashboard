<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Finances"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Family Finances</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#403d39;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:1.6px;color:#8a8279;font-weight:700}.title{font-size:30px;font-weight:650;margin:3px 0}.month{border:0;background:#ebe6de;border-radius:12px;padding:10px 12px;font-size:14px;color:#403d39}.tabs{display:flex;background:#ebe6de;border-radius:14px;padding:4px;margin:18px 0;gap:2px}.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:11px;padding:8px 2px 7px;font-weight:700;font-size:9px;color:#817a71;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1}.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tab.active{background:#fff;color:#403d39;box-shadow:0 1px 5px rgba(0,0,0,.06)}@media(min-width:430px){.tab{font-size:10px;padding:9px 3px}.tab svg{width:19px;height:19px}}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.panel{background:#ebe6de;border-radius:16px;padding:16px}.label{font-size:11px;letter-spacing:1.2px;font-weight:750;color:#817a71}.value{font-size:25px;font-weight:650;margin-top:6px}.wide{grid-column:1/-1}.bar{height:8px;background:#d9d2c8;border-radius:9px;margin-top:12px;overflow:hidden}.bar>i{display:block;height:100%;background:#73866f}.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #d9d2c8}.row:last-child{border:0}.grow{flex:1;min-width:0}.desc{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#817a71;margin-top:3px}.amount{font-size:15px;font-weight:700}.income{color:#5e795b}.expense{color:#403d39}.pill{font-size:11px;padding:4px 7px;background:#ddd6cc;border-radius:999px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}.sectiontitle{font-size:12px;letter-spacing:1.3px;font-weight:750;color:#817a71}.btn{border:0;background:#403d39;color:white;border-radius:12px;padding:11px 14px;font-weight:700}.btn.light{background:#ebe6de;color:#403d39}.btn.danger{background:#a44b47}.empty{padding:28px 10px;text-align:center;color:#817a71}.search{width:100%;border:0;background:#ebe6de;border-radius:13px;padding:13px 14px;font-size:16px;outline:0}.account{display:flex;justify-content:space-between;align-items:center;background:#ebe6de;border-radius:15px;padding:16px;margin-bottom:10px}.modalbg{display:none;position:fixed;inset:0;background:rgba(45,42,38,.35);align-items:flex-end;z-index:10}.modalbg.show{display:flex}.modal{width:100%;max-width:680px;margin:auto;background:#f6f3ee;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px}.field{margin:11px 0}.field label{display:block;font-size:11px;letter-spacing:1px;color:#817a71;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #ddd6cc;background:#fff;border-radius:11px;padding:12px;font-size:16px}.actions{display:flex;gap:9px;margin-top:18px}.actions .btn{flex:1}.catrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d9d2c8}.small{font-size:12px;color:#817a71}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#403d39;color:#fff;padding:10px 14px;border-radius:11px;font-size:13px;display:none;z-index:20}
</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">FAMILY HUB</div><div class="title">Finances</div></div><input id="month" class="month" type="text" inputmode="numeric" readonly></div><div class="tabs"><button class="tab active" data-p="overview"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg><span>OVERVIEW</span></button><button class="tab" data-p="transactions"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14"/><path d="M2 5h.01M2 12h.01M2 19h.01"/></svg><span>ACTIVITY</span></button><button class="tab" data-p="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>BILLS</span></button><button class="tab" data-p="budgets"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c.7-1.3 4.5-1.4 4.8.5.4 2.5-5.1 1.4-4.6 4 .4 2 4.4 1.8 5 .3"/></svg><span>BUDGET</span></button><button class="tab" data-p="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>ACCOUNTS</span></button></div>
<section id="overview" class="page active"><div class="cards"><div class="card"><div class="label">INCOME</div><div id="income" class="value">—</div></div><div class="card"><div class="label">EXPENSES</div><div id="expenses" class="value">—</div></div><div class="card wide"><div class="label">MONTHLY BALANCE</div><div id="balance" class="value">—</div><div id="budgetText" class="small" style="margin-top:10px"></div><div class="bar"><i id="budgetBar" style="width:0"></i></div></div></div><div class="sectionhead"><div class="sectiontitle">SPENDING BY CATEGORY</div></div><div id="categories" class="panel"></div></section>
<section id="transactions" class="page"><input id="search" class="search" placeholder="Search transactions..."><div class="sectionhead"><div class="sectiontitle">TRANSACTIONS</div><button class="btn" id="addTx">+ TRANSACTION</button></div><div id="txList" class="panel"></div></section>
<section id="bills" class="page"><div class="sectionhead"><div class="sectiontitle">BILLS</div><button class="btn" id="addBill">+ BILL</button></div><div id="billList" class="panel"></div></section><section id="budgets" class="page"><div class="sectionhead"><div class="sectiontitle">MONTHLY BUDGET</div><button class="btn" id="setBudget">SET BUDGET</button></div><div id="budgetPanel" class="panel"></div><div class="sectionhead"><div class="sectiontitle">CATEGORIES</div><button class="btn light" id="addCat">+ CATEGORY</button></div><div id="catList" class="panel"></div></section>
<section id="accounts" class="page"><div class="sectionhead"><div class="sectiontitle">FAMILY ACCOUNTS</div><button class="btn" id="addAccount">+ ACCOUNT</button></div><div id="accountList"></div><div class="small" style="padding:10px 2px">Owner is stored only as technical metadata for future Open Finance consent management. The financial view remains Family-wide.</div></section></div>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
(function(){var S={summary:null,tx:[],cats:[],accounts:[],budgets:[],bills:[]};function $(x){return document.getElementById(x)}function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function req(method,url,data,cb){var x=new XMLHttpRequest();x.open(method,url,true);x.setRequestHeader('content-type','application/json');x.onreadystatechange=function(){if(x.readyState===4){var r={};try{r=JSON.parse(x.responseText)}catch(e){}cb(x.status,r)}};x.send(data?JSON.stringify(data):null)}function toast(t){$('toast').innerHTML=esc(t);$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},2200)}function pad2(n){n=String(n);return n.length<2?'0'+n:n}function month(){return $('month').value}function bounds(){var p=month().split('-'),y=+p[0],m=+p[1];var a=month()+'-01',d=new Date(y,m,1),b=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-01';return [a,b]}
function cacheKey(){return 'familyFinance:v271:'+month()}function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({summary:S.summary,tx:S.tx,cats:S.cats,accounts:S.accounts,budgets:S.budgets,bills:S.bills,at:new Date().getTime()}))}catch(e){}}function loadCache(){try{var raw=localStorage.getItem(cacheKey());if(!raw)return;var c=JSON.parse(raw);S.summary=c.summary||null;S.tx=c.tx||[];S.cats=c.cats||[];S.accounts=c.accounts||[];S.budgets=c.budgets||[];S.bills=c.bills||[];renderOverview();renderTx();renderCats();renderAccounts();renderBudget();renderBills()}catch(e){}}
function loadAll(){var b=bounds();req('GET','/api/finance/summary?month='+month(),null,function(s,r){if(s===200){S.summary=r;renderOverview();renderBudget();saveCache()}});req('GET','/api/finance/transactions?from='+b[0]+'&to='+b[1],null,function(s,r){if(s===200){S.tx=r.transactions||[];renderTx();saveCache()}});req('GET','/api/finance/categories',null,function(s,r){if(s===200){S.cats=r.categories||[];renderCats();saveCache()}});req('GET','/api/finance/accounts',null,function(s,r){if(s===200){S.accounts=r.accounts||[];renderAccounts();saveCache()}});req('GET','/api/finance/budgets?month='+month(),null,function(s,r){if(s===200){S.budgets=r.budgets||[];renderBudget();saveCache()}});req('GET','/api/finance/bills',null,function(s,r){if(s===200){S.bills=r.bills||[];renderBills();saveCache()}})}
function renderOverview(){var r=S.summary;if(!r)return;$('income').innerHTML=money(r.income);$('expenses').innerHTML=money(r.expenses);$('balance').innerHTML=(r.balance>=0?'+ ':'- ')+money(Math.abs(r.balance));var pct=r.budget&&r.budget>0?Math.round(r.expenses/r.budget*100):0;$('budgetText').innerHTML=r.budget!==null?money(r.expenses)+' of '+money(r.budget)+' · '+pct+'%':'No monthly budget set';$('budgetBar').style.width=Math.min(pct,100)+'%';var h='',c=r.categories||[];for(var i=0;i<c.length;i++)h+='<div class="catrow"><span>'+esc(c[i].category)+'</span><strong>'+money(c[i].amount)+'</strong></div>';$('categories').innerHTML=h||'<div class="empty">No spending yet.</div>'}
function renderTx(){var q=$('search').value.toLowerCase(),h='',a=S.tx;for(var i=0;i<a.length;i++){var t=a[i];if(q&&(t.description+' '+(t.category||'')+' '+(t.account||'')).toLowerCase().indexOf(q)<0)continue;h+='<div class="row" data-id="'+t.id+'"><div class="grow"><div class="desc">'+esc(t.description)+'</div><div class="meta">'+esc(t.transaction_date)+' · '+esc(t.category||'Uncategorized')+(t.subcategory?' / '+esc(t.subcategory):'')+(t.account?' · '+esc(t.account):'')+(t.review_status==='needs_review'?' · NEEDS REVIEW':'')+'</div></div><div class="amount '+esc(t.type)+'">'+(t.type==='expense'?'- ':t.type==='income'?'+ ':'')+money(t.amount)+'</div></div>'}$('txList').innerHTML=h||'<div class="empty">No transactions this month.</div>';var rows=$('txList').querySelectorAll('.row');for(var j=0;j<rows.length;j++)rows[j].onclick=function(){editTx(+this.getAttribute('data-id'))}}
function renderCats(){var h='';for(var i=0;i<S.cats.length;i++){var c=S.cats[i];h+='<div class="catrow"><span>'+esc(c.name)+'</span><span class="pill">'+esc(c.type.toUpperCase())+'</span></div>'}$('catList').innerHTML=h||'<div class="empty">No categories.</div>'}
function renderAccounts(){var h='';for(var i=0;i<S.accounts.length;i++){var a=S.accounts[i];h+='<div class="account"><div><div class="desc">'+esc(a.name)+'</div><div class="meta">'+esc(a.institution||'')+(a.kind?' · '+esc(a.kind):'')+'</div></div><span class="pill">'+esc(a.owner||'Family')+'</span></div>'}$('accountList').innerHTML=h||'<div class="empty panel">No accounts yet.</div>'}
function renderBudget(){var r=S.summary,b=null;for(var i=0;i<S.budgets.length;i++)if(!S.budgets[i].category_id)b=S.budgets[i];$('budgetPanel').innerHTML='<div class="label">'+esc(month())+'</div><div class="value">'+(b?money(b.amount):r&&r.budget!==null?money(r.budget):'Not set')+'</div><div class="small" style="margin-top:8px">Family-wide monthly spending target</div>'}
function options(type,selected){var h='<option value="">None / Uncategorized</option>';for(var i=0;i<S.cats.length;i++){var c=S.cats[i];if(type&&c.type!==type)continue;h+='<option value="'+c.id+'" '+(+selected===+c.id?'selected':'')+'>'+esc(c.name)+'</option>'}return h}function accOptions(selected){var h='<option value="">No account</option>';for(var i=0;i<S.accounts.length;i++){var a=S.accounts[i];h+='<option value="'+a.id+'" '+(+selected===+a.id?'selected':'')+'>'+esc(a.name)+'</option>'}return h}function modal(html){$('modal').innerHTML=html;$('modalbg').className='modalbg show'}function close(){ $('modalbg').className='modalbg'}$('modalbg').onclick=function(e){if(e.target===$('modalbg'))close()}
function txForm(t){t=t||{type:'expense',transaction_date:new Date().toISOString().slice(0,10),amount:'',description:'',category_id:'',account_id:''};modal('<h2>'+(t.id?'Edit':'Add')+' Transaction</h2><div class="field"><label>TYPE</label><select id="fType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer</option></select></div><div class="field"><label>AMOUNT (BRL)</label><input id="fAmount" inputmode="decimal" value="'+esc(t.amount)+'"></div><div class="field"><label>DESCRIPTION</label><input id="fDesc" value="'+esc(t.description)+'"></div><div class="field"><label>DATE</label><input id="fDate" type="date" value="'+esc(t.transaction_date)+'"></div><div class="field"><label>CATEGORY</label><select id="fCat"></select></div><div class="field"><label>SUBCATEGORY</label><input id="fSub" value="'+esc(t.subcategory||'')+'"></div><div class="field"><label>ACCOUNT</label><select id="fAcc">'+accOptions(t.account_id)+'</select></div><div class="field"><label><input id="fRule" type="checkbox"> Create rule for similar descriptions</label></div><div class="actions">'+(t.id?'<button id="delTx" class="btn danger">DELETE</button>':'')+'<button id="cancel" class="btn light">CANCEL</button><button id="saveTx" class="btn">SAVE</button></div>');$('fType').value=t.type;$('fCat').innerHTML=options(t.type==='income'?'income':t.type==='expense'?'expense':null,t.category_id);$('fType').onchange=function(){$('fCat').innerHTML=options(this.value==='income'?'income':this.value==='expense'?'expense':null,'')};$('cancel').onclick=close;$('saveTx').onclick=function(){var data={action:t.id?'update':'create',id:t.id,date:$('fDate').value,description:$('fDesc').value,amount:parseFloat($('fAmount').value.replace(',','.')),type:$('fType').value,categoryId:$('fCat').value||null,accountId:$('fAcc').value||null,subcategory:$('fSub').value||null,reviewStatus:'reviewed'};var makeRule=$('fRule').checked,rulePattern=$('fDesc').value;close();req('POST','/api/finance/transactions',data,function(s,r){if(s>=200&&s<300){if(makeRule&&data.categoryId)req('POST','/api/finance/rules',{pattern:rulePattern,categoryId:data.categoryId,matchType:'contains'},function(){});toast('Transaction saved');loadAll()}else toast(r.error||'Could not save')})};if(t.id)$('delTx').onclick=function(){if(!confirm('Delete transaction?'))return;close();req('POST','/api/finance/transactions',{action:'delete',id:t.id},function(){loadAll()})}}
function editTx(id){for(var i=0;i<S.tx.length;i++)if(+S.tx[i].id===id){var t=S.tx[i];var c=null,a=null;for(var j=0;j<S.cats.length;j++)if(S.cats[j].name===t.category)c=S.cats[j].id;for(var k=0;k<S.accounts.length;k++)if(S.accounts[k].name===t.account)a=S.accounts[k].id;txForm({id:t.id,type:t.type,transaction_date:t.transaction_date,amount:t.amount,description:t.description,category_id:c,account_id:a,subcategory:t.subcategory||''});return}}

function renderBills(){var h='';for(var i=0;i<S.bills.length;i++){var b=S.bills[i];h+='<div class="row" data-bid="'+b.id+'"><div class="grow"><div class="desc">'+esc(b.name)+'</div><div class="meta">Due '+esc(b.due_date)+' · '+esc(b.category||'Uncategorized')+' · '+esc(b.recurrence||'none')+'</div></div><div><div class="amount">'+money(b.amount)+'</div><div class="pill">'+esc(String(b.status||'upcoming').toUpperCase())+'</div></div></div>'}$('billList').innerHTML=h||'<div class="empty">No bills yet.</div>';var rows=$('billList').querySelectorAll('.row');for(var j=0;j<rows.length;j++)rows[j].onclick=function(){editBill(+this.getAttribute('data-bid'))}}
function billForm(b){b=b||{name:'',amount:'',due_date:new Date().toISOString().slice(0,10),category_id:'',recurrence:'none',status:'upcoming',notes:''};modal('<h2>'+(b.id?'Edit':'Add')+' Bill</h2><div class="field"><label>NAME</label><input id="blName" value="'+esc(b.name||'')+'"></div><div class="field"><label>AMOUNT (BRL)</label><input id="blAmount" inputmode="decimal" value="'+esc(b.amount||'')+'"></div><div class="field"><label>DUE DATE</label><input id="blDue" type="date" value="'+esc(b.due_date||'')+'"></div><div class="field"><label>CATEGORY</label><select id="blCat">'+options('expense',b.category_id)+'</select></div><div class="field"><label>RECURRENCE</label><select id="blRec"><option value="none">One-time</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div><div class="field"><label>STATUS</label><select id="blStatus"><option value="upcoming">Upcoming</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></div><div class="field"><label>NOTES</label><input id="blNotes" value="'+esc(b.notes||'')+'"></div><div class="actions">'+(b.id?'<button id="delBill" class="btn danger">DELETE</button>':'')+'<button id="cancel" class="btn light">CANCEL</button><button id="saveBill" class="btn">SAVE</button></div>');$('blRec').value=b.recurrence||'none';$('blStatus').value=b.status||'upcoming';$('cancel').onclick=close;$('saveBill').onclick=function(){var d={action:b.id?'update':'create',id:b.id,name:$('blName').value,amount:parseFloat($('blAmount').value.replace(',','.')),dueDate:$('blDue').value,categoryId:$('blCat').value||null,recurrence:$('blRec').value,status:$('blStatus').value,notes:$('blNotes').value};close();req('POST','/api/finance/bills',d,function(s,r){if(s>=200&&s<300){toast('Bill saved');loadAll()}else toast(r.error||'Could not save')})};if(b.id)$('delBill').onclick=function(){if(!confirm('Delete bill?'))return;close();req('POST','/api/finance/bills',{action:'delete',id:b.id},function(){loadAll()})}}
function editBill(id){for(var i=0;i<S.bills.length;i++)if(+S.bills[i].id===id){var b=S.bills[i],c=null;for(var j=0;j<S.cats.length;j++)if(S.cats[j].name===b.category)c=S.cats[j].id;billForm({id:b.id,name:b.name,amount:b.amount,due_date:b.due_date,category_id:c,recurrence:b.recurrence,status:b.status,notes:b.notes||''});return}}
$('addBill').onclick=function(){billForm()};
$('addTx').onclick=function(){txForm()};$('setBudget').onclick=function(){modal('<h2>Monthly Budget</h2><div class="field"><label>MONTH</label><input id="bMonth" type="text" inputmode="numeric" readonly value="'+month()+'"></div><div class="field"><label>AMOUNT (BRL)</label><input id="bAmount" inputmode="decimal"></div><div class="actions"><button id="cancel" class="btn light">CANCEL</button><button id="saveB" class="btn">SAVE</button></div>');$('cancel').onclick=close;$('saveB').onclick=function(){var d={month:$('bMonth').value,amount:parseFloat($('bAmount').value.replace(',','.'))};close();req('POST','/api/finance/budgets',d,function(s,r){if(s===200){toast('Budget saved');loadAll()}else toast(r.error||'Could not save')})}};$('addCat').onclick=function(){modal('<h2>Add Category</h2><div class="field"><label>NAME</label><input id="cName"></div><div class="field"><label>TYPE</label><select id="cType"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="actions"><button id="cancel" class="btn light">CANCEL</button><button id="saveC" class="btn">ADD</button></div>');$('cancel').onclick=close;$('saveC').onclick=function(){var d={name:$('cName').value,type:$('cType').value};close();req('POST','/api/finance/categories',d,function(s,r){if(s>=200&&s<300){toast('Category added');loadAll()}else toast(r.error||'Could not add')})}};$('addAccount').onclick=function(){modal('<h2>Add Account</h2><div class="field"><label>NAME</label><input id="aName" placeholder="e.g. Main checking"></div><div class="field"><label>INSTITUTION</label><input id="aInst" placeholder="e.g. Nubank"></div><div class="field"><label>TYPE</label><select id="aKind"><option value="checking">Checking</option><option value="savings">Savings</option><option value="credit_card">Credit card</option><option value="investment">Investment</option><option value="cash">Cash</option></select></div><div class="field"><label>CONSENT OWNER</label><select id="aOwner"><option>Family</option><option>John</option><option>Amanda</option></select></div><div class="actions"><button id="cancel" class="btn light">CANCEL</button><button id="saveA" class="btn">ADD</button></div>');$('cancel').onclick=close;$('saveA').onclick=function(){var d={name:$('aName').value,institution:$('aInst').value,kind:$('aKind').value,owner:$('aOwner').value};close();req('POST','/api/finance/accounts',d,function(s,r){if(s>=200&&s<300){toast('Account added');loadAll()}else toast(r.error||'Could not add')})}}
var tabs=document.getElementsByClassName('tab');for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){for(var j=0;j<tabs.length;j++)tabs[j].className='tab';this.className='tab active';var pages=document.getElementsByClassName('page');for(j=0;j<pages.length;j++)pages[j].className='page';$(this.getAttribute('data-p')).className='page active'};$('search').oninput=renderTx;$('month').onchange=function(){loadCache();loadAll()};var n=new Date();$('month').value=n.getFullYear()+'-'+pad2(n.getMonth()+1);try{loadCache();loadAll()}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:Arial;color:#403d39"><h2>Finances could not start</h2><p>Please refresh the page. If this continues, the app will report a compatibility error.</p><pre style="white-space:pre-wrap">'+esc(e&&e.message?e.message:String(e))+'</pre></div>'}})();
</script></body></html>
